name: Phase 220 Bootstrap Permission Check

on:
  workflow_dispatch:
  push:
    branches:
      - phase218-bootstrap

permissions:
  contents: read

jobs:
  permission-check:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow execution
        run: |
          echo "phase220-bootstrap-workflow=ok"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
