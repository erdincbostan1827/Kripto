name: Phase 222 Lock Refresh
on:
  push:
    branches: [phase222-ci-stabilization]
permissions:
  contents: write
jobs:
  refresh-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Refresh Python lock
        run: |
          python -m pip install 'uv==0.12.9'
          uv lock --upgrade-package pytest
          uv lock --check
      - name: Refresh frontend lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Validate refreshed frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Frontend critical audit
        id: npm_audit
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          mkdir -p ../reports
          npm audit --audit-level=critical 2>&1 | tee ../reports/NPM_AUDIT_LOCK_REFRESH.txt
      - name: Write lock refresh summary
        if: always()
        env:
          NPM_AUDIT: ${{ steps.npm_audit.outcome }}
        run: |
          mkdir -p reports
          echo "npm_audit=$NPM_AUDIT" | tee reports/LOCK_REFRESH_SUMMARY.txt
      - name: Upload refreshed locks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase222-lock-refresh-${{ github.run_id }}
          path: |
            uv.lock
            frontend/package-lock.json
            reports/
          if-no-files-found: error
      - name: Commit verified refreshed locks
        if: steps.npm_audit.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'LOCK_REFRESH_COMMIT=NO_CHANGES'
          else
            git commit -m 'phase222: refresh dependency locks'
            git push origin HEAD:phase222-ci-stabilization
            echo 'LOCK_REFRESH_COMMIT=PUSHED'
          fi
      - name: Enforce refreshed frontend audit
        if: always()
        env:
          NPM_AUDIT: ${{ steps.npm_audit.outcome }}
        run: test "$NPM_AUDIT" = "success"
