name: Phase222 Lock Refresh Candidate

on:
  push:
    branches:
      - phase222-ci-stabilization

permissions:
  contents: write

jobs:
  generate-lock-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install 'uv==0.12.9'
      - name: Generate deterministic lock candidate
        run: |
          mkdir -p reports
          uv lock --upgrade-package anyio
          uv lock --check
          cp uv.lock reports/uv.lock.generated
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          p = Path('reports/uv.lock.generated')
          print('uv_lock_sha256=' + sha256(p.read_bytes()).hexdigest())
          PY
      - name: Commit refreshed lock when changed
        run: |
          if git diff --quiet -- uv.lock; then
            echo 'uv.lock already matches pyproject.toml'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'phase222: lock AnyIO 4.13.0'
          git push origin HEAD:phase222-ci-stabilization
      - name: Upload lock candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase222-lock-candidate-${{ github.run_id }}
          path: reports/uv.lock.generated
          if-no-files-found: error
