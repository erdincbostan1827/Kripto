name: Phase 221 Workflow Tag Push Permission Probe

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  workflow-tag-push-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create workflow-bearing commit and push via temporary tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          WORK="$RUNNER_TEMP/phase221-tag-probe"
          git clone --no-tags "$REPO" "$WORK"
          cd "$WORK"
          git config user.name "phase221-permission-probe"
          git config user.email "phase221-probe@users.noreply.github.com"
          cat > .github/workflows/phase221-nested-probe.yml <<'YAML'
          name: Phase 221 Nested Probe
          on:
            workflow_dispatch:
          jobs:
            noop:
              runs-on: ubuntu-latest
              steps:
                - run: echo nested-probe
          YAML
          git add .github/workflows/phase221-nested-probe.yml
          git commit -m "Phase 221 probe workflow-bearing tag push"
          TAG="phase221-workflow-tag-probe-${GITHUB_RUN_ID}"
          git tag "$TAG"
          git push origin "refs/tags/$TAG:refs/tags/$TAG"
          git ls-remote --exit-code --tags origin "$TAG"
          git push origin ":refs/tags/$TAG"
          echo "PHASE221_WORKFLOW_FILE_TAG_PUSH_PERMISSION=PASS"
