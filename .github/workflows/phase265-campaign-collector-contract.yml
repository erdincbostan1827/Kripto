name: Phase265 Campaign Collector Contract

on:
  push:
  pull_request:
    paths:
      - 'backend/app/release/campaign_collector.py'
      - 'backend/app/release/campaign_runtime_adapter.py'
      - 'scripts/external/phase265_campaign_collector.py'
      - 'scripts/external/record_campaign_evidence.py'
      - 'tests/test_phase265_campaign_collector.py'
      - 'tests/test_phase265_campaign_runtime_adapter.py'
      - 'tests/test_phase265_cli_truth_boundary.py'
      - '.github/workflows/phase265-campaign-collector-contract.yml'

permissions:
  contents: read

jobs:
  phase265-contract:
    name: phase265-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install locked test environment
        run: |
          python -m pip install 'uv==0.12.9'
          uv sync --locked --extra test
      - name: Compile Phase265 surfaces
        run: |
          .venv/bin/python -m py_compile \
            backend/app/release/campaign_collector.py \
            backend/app/release/campaign_runtime_adapter.py \
            scripts/external/phase265_campaign_collector.py \
            scripts/external/record_campaign_evidence.py \
            tests/test_phase265_campaign_collector.py \
            tests/test_phase265_campaign_runtime_adapter.py \
            tests/test_phase265_cli_truth_boundary.py
      - name: Run Phase265 fail-closed contract tests
        run: |
          .venv/bin/python -m pytest -q -W error \
            tests/test_phase265_campaign_collector.py \
            tests/test_phase265_campaign_runtime_adapter.py \
            tests/test_phase265_cli_truth_boundary.py
