name: Phase 244 WORM Acceptance
run-name: Phase 244 WORM Acceptance ${{ inputs.candidate_ref }}

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact 40-character commit SHA to validate on the production-acceptance runner
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase244-worm-acceptance-${{ inputs.candidate_ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12.10'

jobs:
  worm-acceptance:
    name: worm-acceptance
    runs-on: [self-hosted, production-acceptance]
    environment: production-acceptance
    timeout-minutes: 90
    env:
      ACCEPTANCE_REQUIRE_CHALLENGE_TRUST: '1'
      ACCEPTANCE_CHALLENGE_VERIFY_COMMAND: ${{ secrets.ACCEPTANCE_CHALLENGE_VERIFY_COMMAND }}
      WORM_ACCEPTANCE_COMMAND: ${{ secrets.WORM_ACCEPTANCE_COMMAND }}
      WORM_EVIDENCE_JSON: ${{ secrets.WORM_EVIDENCE_JSON }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
          clean: true

      - name: Setup pinned Python from runner tool cache
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: false

      - name: Enforce immutable candidate and source locks
        shell: pwsh
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_REF -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'candidate_ref must be an exact 40-character commit SHA'
          }
          python scripts/validate_acceptance_ref.py $env:CANDIDATE_REF
          if ($LASTEXITCODE -ne 0) { throw 'Immutable candidate validation failed.' }
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:CANDIDATE_REF.ToLowerInvariant()) {
            throw "Checked out SHA mismatch: $head"
          }
          python scripts/verify_source_locks.py
          if ($LASTEXITCODE -ne 0) { throw 'Source-lock verification failed.' }

      - name: Enforce WORM-only external secret scope
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('ACCEPTANCE_CHALLENGE_VERIFY_COMMAND','WORM_ACCEPTANCE_COMMAND','WORM_EVIDENCE_JSON')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) { throw "Required Phase 244 acceptance input is missing: $name" }
          }

      - name: Prepare isolated WORM target identity
        shell: pwsh
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $reports = Join-Path $PWD 'reports/external_acceptance'
          New-Item -ItemType Directory -Force -Path $reports | Out-Null
          $runtimeEnv = Join-Path $reports 'phase244_runtime.env'
          Copy-Item -LiteralPath '.env.example' -Destination $runtimeEnv -Force

          if (Test-Path -LiteralPath 'secrets') {
            throw 'Pre-existing secrets directory detected after clean checkout; refusing to reuse it for Phase 244.'
          }
          python scripts/bootstrap_secrets.py
          if ($LASTEXITCODE -ne 0) { throw 'Ephemeral acceptance secret bootstrap failed.' }

          $shortSha = $env:CANDIDATE_REF.Substring(0, 12).ToLowerInvariant()
          $projectName = "kripto_phase244_$shortSha"
          $acceptanceEnvironmentId = "github-actions:$env:RUNNER_NAME:$env:RUNNER_OS:$env:RUNNER_ARCH:$projectName"

          $env:COMPOSE_PROJECT_NAME = $projectName
          $env:APP_ENV_FILE = 'reports/external_acceptance/phase244_runtime.env'
          $env:ACCEPTANCE_ENVIRONMENT_ID = $acceptanceEnvironmentId
          "COMPOSE_PROJECT_NAME=$projectName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_ENV_FILE=reports/external_acceptance/phase244_runtime.env" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ACCEPTANCE_ENVIRONMENT_ID=$acceptanceEnvironmentId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $composeConfig = & docker compose config 2>&1
          if ($LASTEXITCODE -ne 0) {
            $composeConfig | Out-Host
            throw 'docker compose config failed for isolated Phase 244 environment.'
          }
          $composeConfigPath = Join-Path $reports 'phase244_compose_config.txt'
          $composeConfig | Set-Content -LiteralPath $composeConfigPath -Encoding utf8
          $topologyHash = (Get-FileHash -LiteralPath $composeConfigPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:ACCEPTANCE_TOPOLOGY_HASH = $topologyHash
          "ACCEPTANCE_TOPOLOGY_HASH=$topologyHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $identityDir = Join-Path $PWD 'reports/phase244'
          New-Item -ItemType Directory -Force -Path $identityDir | Out-Null
          $identity = [ordered]@{
            schema_version = '1.0'
            classification = 'PHASE244_WORM_TARGET_IDENTITY_NOT_ACCEPTANCE_EVIDENCE'
            candidate_sha = $env:CANDIDATE_REF.ToLowerInvariant()
            runner_name = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            compose_project_name = $projectName
            acceptance_environment_id = $acceptanceEnvironmentId
            topology_hash = $topologyHash
            truth_policy = 'This identity receipt binds the WORM attempt to the actual self-hosted runner and compose topology; PASS still requires trusted challenge, runtime prerequisite and semantic WORM evidence.'
          }
          $identity | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $identityDir 'WORM_TARGET_IDENTITY.json') -Encoding utf8

      - name: Generate fresh release-bound challenge
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          python scripts/generate_acceptance_challenge.py
          if ($LASTEXITCODE -ne 0) { throw 'Release challenge generation failed.' }

      - name: Run fail-closed runtime prerequisite
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          python scripts/external_acceptance_runner.py --profile runtime --confirm-real-target --timeout 900
          if ($LASTEXITCODE -ne 0) { throw 'Phase 244 runtime prerequisite did not PASS.' }

      - name: Run fail-closed WORM acceptance profile
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          python scripts/external_acceptance_runner.py --profile worm --confirm-real-target --timeout 1800
          if ($LASTEXITCODE -ne 0) { throw 'Phase 244 WORM acceptance did not PASS.' }

      - name: Capture Phase 244 result
        if: always()
        shell: pwsh
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $PWD 'reports/phase244'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $runtimePath = Join-Path $PWD 'reports/external_acceptance/manifest_runtime.json'
          $wormPath = Join-Path $PWD 'reports/external_acceptance/manifest_worm.json'
          $passed = $false
          $blocker = 'REQUIRED_MANIFEST_MISSING'
          $runtimeGroup = 'NOT_EVALUATED'
          $wormGroup = 'NOT_EVALUATED'
          $challengeVerified = $false
          $challengeTrustVerified = $false

          if ((Test-Path -LiteralPath $runtimePath -PathType Leaf) -and (Test-Path -LiteralPath $wormPath -PathType Leaf)) {
            $runtime = Get-Content -LiteralPath $runtimePath -Raw | ConvertFrom-Json
            $worm = Get-Content -LiteralPath $wormPath -Raw | ConvertFrom-Json
            if ($null -ne $runtime.groups -and $null -ne $runtime.groups.runtime) { $runtimeGroup = [string]$runtime.groups.runtime }
            if ($null -ne $worm.groups -and $null -ne $worm.groups.worm) { $wormGroup = [string]$worm.groups.worm }
            $challengeVerified = ($runtime.challenge.verified -eq $true -and $worm.challenge.verified -eq $true)
            $challengeTrustVerified = ($runtime.challenge.trust_verified -eq $true -and $worm.challenge.trust_verified -eq $true)
            if ($null -ne $worm.PSObject.Properties['blocker']) {
              $blocker = [string]$worm.blocker
            } elseif ($worm.selected_all_pass -eq $true) {
              $blocker = ''
            } else {
              $blocker = 'WORM_PROFILE_NOT_ALL_PASS'
            }
            $passed = (
              $runtime.classification -eq 'EXTERNAL_ACCEPTANCE_EVIDENCE_BUNDLE' -and
              $worm.classification -eq 'EXTERNAL_ACCEPTANCE_EVIDENCE_BUNDLE' -and
              $runtime.profile -eq 'runtime' -and
              $worm.profile -eq 'worm' -and
              $runtime.environment.git_commit_sha -eq $env:CANDIDATE_REF.ToLowerInvariant() -and
              $worm.environment.git_commit_sha -eq $env:CANDIDATE_REF.ToLowerInvariant() -and
              $runtime.real_target_explicitly_confirmed -eq $true -and
              $worm.real_target_explicitly_confirmed -eq $true -and
              $challengeVerified -and
              $challengeTrustVerified -and
              $runtime.selected_all_pass -eq $true -and
              $worm.selected_all_pass -eq $true -and
              $runtimeGroup -eq 'PASS' -and
              $wormGroup -eq 'PASS'
            )
          }

          $result = [ordered]@{
            schema_version = '1.0'
            classification = 'PHASE244_WORM_ACCEPTANCE_WORKFLOW_RESULT'
            candidate_sha = $env:CANDIDATE_REF.ToLowerInvariant()
            runner_name = $env:RUNNER_NAME
            passed = $passed
            blocker = $blocker
            challenge_verified = $challengeVerified
            challenge_trust_verified = $challengeTrustVerified
            runtime_group = $runtimeGroup
            worm_group = $wormGroup
            production_ready = $false
            truth_policy = 'Phase 244 PASS closes only the exact-SHA runtime prerequisite and WORM profile for this target. It does not authorize LIVE trading or close TESTNET/signing/campaign gates.'
          }
          $result | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $outDir 'PHASE244_WORM_RESULT.json') -Encoding utf8
          $result | ConvertTo-Json -Depth 8 | Out-Host

      - name: Tear down isolated WORM resources and erase ephemeral secrets
        if: always()
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not [string]::IsNullOrWhiteSpace($env:COMPOSE_PROJECT_NAME)) {
            docker compose down -v --remove-orphans
            if ($LASTEXITCODE -ne 0) { throw 'Phase 244 isolated compose cleanup failed.' }
          }
          if (Test-Path -LiteralPath 'secrets') {
            Remove-Item -LiteralPath 'secrets' -Recurse -Force
          }

      - name: Upload exact-SHA Phase 244 WORM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase244-worm-acceptance-${{ inputs.candidate_ref }}
          if-no-files-found: error
          retention-days: 30
          path: |
            reports/external_acceptance/release_challenge.json
            reports/external_acceptance/manifest_runtime.json
            reports/external_acceptance/manifest_worm.json
            reports/external_acceptance/runs/**
            reports/external_acceptance/phase244_compose_config.txt
            reports/phase244/**
