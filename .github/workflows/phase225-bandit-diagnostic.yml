name: Phase 225 Bandit Diagnostic

on:
  push:
    branches:
      - phase225-production-acceptance-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit-diagnostic:
    name: bandit-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'

      - name: Install exact Bandit
        run: python -m pip install --disable-pip-version-check 'bandit==1.9.4'

      - name: Run Bandit fail-closed and persist JSON
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p reports/external_acceptance
          set +e
          bandit -q -r backend scripts -f json -o reports/external_acceptance/bandit-report.json
          rc=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('reports/external_acceptance/bandit-report.json')
          if not p.is_file() or p.stat().st_size == 0:
              raise SystemExit('Bandit report missing or empty')
          data = json.loads(p.read_text(encoding='utf-8'))
          for item in data.get('results', []):
              print(f"{item.get('test_id')}|{item.get('filename')}:{item.get('line_number')}|{item.get('issue_severity')}|{item.get('issue_confidence')}|{item.get('issue_text')}")
          print(f"BANDIT_FINDINGS={len(data.get('results', []))}")
          PY
          exit "$rc"

      - name: Upload Bandit diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase225-bandit-diagnostic-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: reports/external_acceptance/bandit-report.json
