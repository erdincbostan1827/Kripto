name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]' ruff mypy pip-audit
      - run: python -m compileall -q backend scripts tests
      - name: Ruff lint
        run: |
          mkdir -p reports
          set -o pipefail
          ruff check backend tests scripts 2>&1 | tee reports/RUFF_CHECK.txt
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruff-diagnostics-${{ github.run_id }}
          path: reports/RUFF_CHECK.txt
          if-no-files-found: ignore
      - run: mypy backend/app --ignore-missing-imports
      - run: pytest -q -W error --junitxml=reports/pytest.xml
      - run: python scripts/prohibited_scan.py
      - run: python scripts/secret_scan.py
      - run: python scripts/local_sast.py
      - run: alembic upgrade head --sql > reports/ALEMBIC_OFFLINE_SQL.txt
      - run: pip-audit
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: test -f frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare compose environment
        run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose --profile test build test app frontend
      - run: docker compose --profile test run --rm test
  release-gate:
    if: github.ref_type == 'tag'
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml
      - run: python scripts/release_gate.py
