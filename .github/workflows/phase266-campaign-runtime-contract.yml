name: Phase266 Campaign Sampling Contract

on:
  push:
    paths:
      - 'scripts/external/phase266_campaign_cycle.py'
      - 'tests/test_phase266_campaign_cycle.py'
      - '.github/workflows/phase266-campaign-runtime.yml'
      - '.github/workflows/phase266-campaign-runtime-contract.yml'
  pull_request:
    paths:
      - 'scripts/external/phase266_campaign_cycle.py'
      - 'tests/test_phase266_campaign_cycle.py'
      - '.github/workflows/phase266-campaign-runtime.yml'
      - '.github/workflows/phase266-campaign-runtime-contract.yml'

permissions:
  contents: read

jobs:
  phase266-contract:
    name: phase266-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install locked test environment
        run: |
          python -m pip install 'uv==0.12.9'
          uv sync --locked --extra test
      - name: Compile Phase266 surfaces
        run: |
          .venv/bin/python -m py_compile \
            scripts/external/phase266_campaign_cycle.py \
            tests/test_phase266_campaign_cycle.py
      - name: Run Phase266 fail-closed contract tests
        run: |
          .venv/bin/python -m pytest -q -W error \
            tests/test_phase266_campaign_cycle.py
