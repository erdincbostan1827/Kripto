name: Phase 252 Atomic Campaign Handoff Syntax

on:
  pull_request:
    paths:
      - 'scripts/external/build_campaign_evidence_bundle.py'
      - 'tools/run_phase252_atomic_campaign_handoff.ps1'
      - 'tests/test_phase252_atomic_campaign_handoff.py'
      - 'scripts/external/stage_campaign_evidence_bundle.py'
      - 'tools/run_phase251_final_production_acceptance.ps1'
      - '.github/workflows/phase252-atomic-campaign-handoff-syntax.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/external/build_campaign_evidence_bundle.py'
      - 'tools/run_phase252_atomic_campaign_handoff.ps1'
      - 'tests/test_phase252_atomic_campaign_handoff.py'
      - 'scripts/external/stage_campaign_evidence_bundle.py'
      - 'tools/run_phase251_final_production_acceptance.ps1'
      - '.github/workflows/phase252-atomic-campaign-handoff-syntax.yml'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12.10'
  PYTEST_VERSION: '9.0.3'

jobs:
  atomic-campaign-handoff-syntax:
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pinned Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: false

      - name: Install pinned contract-test runner
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check "pytest==$env:PYTEST_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned pytest installation failed.' }
          python -m pytest --version
          if ($LASTEXITCODE -ne 0) { throw 'Pinned pytest is unavailable.' }

      - name: Parse Phase 252 PowerShell wrapper
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path 'tools/run_phase252_atomic_campaign_handoff.ps1').Path
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            foreach ($parseError in $errors) {
              Write-Error "$($parseError.Extent.StartLineNumber):$($parseError.Extent.StartColumnNumber) $($parseError.Message)"
            }
            throw "PowerShell parser found $($errors.Count) syntax error(s)."
          }
          Write-Host 'Phase 252 PowerShell syntax: PASS'

      - name: Compile Phase 252 builder
        shell: powershell
        run: |
          python -m py_compile scripts/external/build_campaign_evidence_bundle.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 252 builder compile failed.' }

      - name: Verify Phase 252 atomic handoff contract
        shell: powershell
        run: |
          python -m pytest -q tests/test_phase252_atomic_campaign_handoff.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 252 contract test failed.' }
