name: Backend Full-Tree Typecheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mypy-full-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]' 'mypy==1.17.1'
      - name: Full backend Mypy gate
        run: |
          mkdir -p reports
          set -o pipefail
          MYPYPATH=backend mypy --namespace-packages --explicit-package-bases backend/app --ignore-missing-imports 2>&1 | tee reports/MYPY_FULL_TREE.txt
      - name: Upload full-tree typecheck evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mypy-full-tree-${{ github.run_id }}
          path: reports/MYPY_FULL_TREE.txt
          if-no-files-found: ignore
