name: Phase 221 Keyless Signing Capability

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  keyless-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install cosign from source at pinned version
        shell: bash
        run: |
          set -euo pipefail
          go version
          GOBIN="$RUNNER_TEMP/bin" go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.0
          "$RUNNER_TEMP/bin/cosign" version
      - name: Real GitHub OIDC keyless sign and verify
        shell: bash
        run: |
          set -euo pipefail
          printf 'phase221 trusted signing capability\n' > "$RUNNER_TEMP/phase221-artifact.txt"
          "$RUNNER_TEMP/bin/cosign" sign-blob --yes --bundle "$RUNNER_TEMP/phase221-cosign.bundle" "$RUNNER_TEMP/phase221-artifact.txt"
          "$RUNNER_TEMP/bin/cosign" verify-blob \
            --bundle "$RUNNER_TEMP/phase221-cosign.bundle" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-identity-regexp '^https://github.com/erdincbostan1827/Kripto/.github/workflows/phase220-main-noop.yml@refs/heads/main$' \
            "$RUNNER_TEMP/phase221-artifact.txt"
          test -s "$RUNNER_TEMP/phase221-cosign.bundle"
          echo 'PHASE221_KEYLESS_SIGNING_CAPABILITY=PASS'
