name: Phase 221 WORM Compliance Retry

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worm-object-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: phase221admin
      AWS_SECRET_ACCESS_KEY: phase221secretkey
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Real COMPLIANCE object-lock retention and deletion denial retry
        shell: bash
        run: |
          set -euo pipefail
          docker pull minio/minio:latest
          docker run -d --name phase221-minio \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            -p 9000:9000 \
            minio/minio:latest server /data --console-address ':9001'
          for i in {1..90}; do curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 && break; sleep 1; done
          docker inspect --format='MINIO_IMAGE={{.Image}}' phase221-minio
          command -v aws >/dev/null 2>&1 || python -m pip install --disable-pip-version-check awscli
          ENDPOINT='http://127.0.0.1:9000'
          BUCKET='phase221-worm'
          aws --endpoint-url "$ENDPOINT" s3api create-bucket --bucket "$BUCKET" --object-lock-enabled-for-bucket >/dev/null
          printf 'phase221 immutable evidence\n' > "$RUNNER_TEMP/evidence.txt"
          VERSION="$(aws --endpoint-url "$ENDPOINT" s3api put-object --bucket "$BUCKET" --key evidence.txt --body "$RUNNER_TEMP/evidence.txt" --query VersionId --output text)"
          test -n "$VERSION" && test "$VERSION" != None
          RETAIN_UNTIL="$(date -u -d '+1 day' '+%Y-%m-%dT%H:%M:%SZ')"
          aws --endpoint-url "$ENDPOINT" s3api put-object-retention \
            --bucket "$BUCKET" --key evidence.txt --version-id "$VERSION" \
            --retention "Mode=COMPLIANCE,RetainUntilDate=$RETAIN_UNTIL"
          MODE="$(aws --endpoint-url "$ENDPOINT" s3api get-object-retention --bucket "$BUCKET" --key evidence.txt --version-id "$VERSION" --query 'Retention.Mode' --output text)"
          UNTIL="$(aws --endpoint-url "$ENDPOINT" s3api get-object-retention --bucket "$BUCKET" --key evidence.txt --version-id "$VERSION" --query 'Retention.RetainUntilDate' --output text)"
          echo "RETENTION_MODE=$MODE"
          echo "RETENTION_UNTIL=$UNTIL"
          test "$MODE" = COMPLIANCE
          set +e
          aws --endpoint-url "$ENDPOINT" s3api delete-object --bucket "$BUCKET" --key evidence.txt --version-id "$VERSION" >"$RUNNER_TEMP/delete.out" 2>"$RUNNER_TEMP/delete.err"
          RC=$?
          set -e
          echo "DELETE_EXIT_CODE=$RC"
          sed -E 's/(phase221admin|phase221secretkey)/REDACTED/g' "$RUNNER_TEMP/delete.err" || true
          test "$RC" -ne 0
          MODE_AFTER="$(aws --endpoint-url "$ENDPOINT" s3api get-object-retention --bucket "$BUCKET" --key evidence.txt --version-id "$VERSION" --query 'Retention.Mode' --output text)"
          test "$MODE_AFTER" = COMPLIANCE
          aws --endpoint-url "$ENDPOINT" s3api head-object --bucket "$BUCKET" --key evidence.txt --version-id "$VERSION" >/dev/null
          FOUND="$(aws --endpoint-url "$ENDPOINT" s3api list-object-versions --bucket "$BUCKET" --query "Versions[?Key=='evidence.txt' && VersionId=='$VERSION'] | length(@)" --output text)"
          test "$FOUND" = 1
          echo 'PHASE221_WORM_COMPLIANCE_DELETE_DENIAL=PASS'
