name: Production Acceptance
run-name: Production Acceptance ${{ inputs.acceptance_ref }}

on:
  workflow_dispatch:
    inputs:
      acceptance_ref:
        description: Immutable git tag or SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-acceptance-${{ github.event.inputs.acceptance_ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12.10'
  NODE_VERSION: '24'
  UV_VERSION: '0.12.9'

jobs:
  ci-build-evidence:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      container_image: ${{ steps.identity.outputs.container_image }}
      container_digest: ${{ steps.image_digest.outputs.container_digest }}
      build_artifact_id: ${{ steps.upload_build_evidence.outputs.artifact-id }}
      build_artifact_digest: ${{ steps.upload_build_evidence.outputs.artifact-digest }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.inputs.acceptance_ref }}
          fetch-depth: 0

      - name: Enforce immutable acceptance ref
        run: python scripts/validate_acceptance_ref.py "${{ github.event.inputs.acceptance_ref }}"

      - name: Verify immutable GitHub Action pins
        run: python scripts/verify_workflow_action_pins.py

      - name: Verify production acceptance hardening invariants
        run: python scripts/verify_production_acceptance_hardening.py

      - name: Verify production acceptance contract parity
        run: python scripts/verify_acceptance_contract_parity.py

      - name: Verify committed source locks
        run: python scripts/verify_source_locks.py

      - name: Candidate identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          test -n "$SHA"
          REPOSITORY_LC="${GITHUB_REPOSITORY,,}"
          IMAGE="ghcr.io/${REPOSITORY_LC}/acceptance:${SHA}"
          test "$IMAGE" = "${IMAGE,,}"
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "container_image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "ACCEPTANCE_CONTAINER_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Verify backend lock is reproducible
        run: uv lock --locked

      - name: Install frontend from committed lock
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend from lock
        run: uv sync --locked --extra test
      - name: Static and secret checks
        run: |
          uv run python -m compileall -q backend scripts tests
          uv run python scripts/prohibited_scan.py
          uv run python scripts/secret_scan.py
          uv run python scripts/local_sast.py

      - name: Canonical local acceptance shards
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reports/local_acceptance
          for i in $(seq 0 23); do
            uv run python scripts/local_acceptance_runner.py --shard-index "$i" --shard-count 24 --timeout 1200
          done
          uv run python scripts/merge_local_acceptance.py --shard-count 24
          uv run python scripts/verify_local_acceptance.py

      - name: Build and push immutable acceptance image
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --file backend/Dockerfile --target runtime -t "$ACCEPTANCE_CONTAINER_IMAGE" .
          docker push "$ACCEPTANCE_CONTAINER_IMAGE"
          docker pull "$ACCEPTANCE_CONTAINER_IMAGE"

      - name: Capture immutable container digest
        id: image_digest
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$ACCEPTANCE_CONTAINER_IMAGE")"
          test -n "$DIGEST"
          case "$DIGEST" in *@sha256:*) ;; *) echo 'missing immutable repo digest' >&2; exit 2;; esac
          echo "container_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$DIGEST" > reports/CI_CONTAINER_REPODIGEST.txt

      - name: Install supply-chain scanners and capture exact toolchain receipt
        run: |
          python -m pip install 'pip-audit==2.10.1' 'bandit==1.9.4' 'semgrep==1.175.0' 'cyclonedx-bom==7.3.1' 'pip-licenses==5.5.5'
          python -m pip freeze | sort > reports/CI_SCANNER_VERSIONS.txt
          python scripts/ci_toolchain_receipt.py create
          python scripts/ci_toolchain_receipt.py verify --expected-git-sha "$(git rev-parse HEAD)" --verify-installed

      - name: Resolve scanner images to immutable digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/external_acceptance
          resolve_digest() {
            local image="$1"
            docker pull "$image" >/dev/null
            local digest
            digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
            case "$digest" in *@sha256:????????????????????????????????????????????????????????????????) ;; *) echo "invalid RepoDigest for $image" >&2; exit 2;; esac
            printf '%s' "$digest"
          }
          GITLEAKS_IMAGE='ghcr.io/gitleaks/gitleaks:v8.28.0'
          TRIVY_IMAGE='aquasec/trivy:0.65.0'
          SYFT_IMAGE='anchore/syft:v1.32.0'
          GITLEAKS_DIGEST="$(resolve_digest "$GITLEAKS_IMAGE")"
          TRIVY_DIGEST="$(resolve_digest "$TRIVY_IMAGE")"
          SYFT_DIGEST="$(resolve_digest "$SYFT_IMAGE")"
          export GITLEAKS_IMAGE TRIVY_IMAGE SYFT_IMAGE GITLEAKS_DIGEST TRIVY_DIGEST SYFT_DIGEST
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'schema_version': '1.0',
              'classification': 'CI_SCANNER_IMAGE_DIGEST_RECEIPT',
              'scanners': {
                  'gitleaks': {'requested_image': os.environ['GITLEAKS_IMAGE'], 'resolved_digest': os.environ['GITLEAKS_DIGEST']},
                  'trivy': {'requested_image': os.environ['TRIVY_IMAGE'], 'resolved_digest': os.environ['TRIVY_DIGEST']},
                  'syft': {'requested_image': os.environ['SYFT_IMAGE'], 'resolved_digest': os.environ['SYFT_DIGEST']},
              },
          }
          Path('reports/external_acceptance/scanner_image_digests.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          python scripts/external/verify_scanner_image_digests.py
          printf 'GITLEAKS_DIGEST=%s\nTRIVY_DIGEST=%s\nSYFT_DIGEST=%s\n' "$GITLEAKS_DIGEST" "$TRIVY_DIGEST" "$SYFT_DIGEST" >> "$GITHUB_ENV"

      - name: Supply-chain scans and real SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/external_acceptance
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file reports/external_acceptance/requirements.locked.txt
          pip-audit -r reports/external_acceptance/requirements.locked.txt
          set +e
          bandit -q -r backend scripts -f json -o reports/external_acceptance/bandit-report.json
          BANDIT_RC=$?
          set -e
          if [ "$BANDIT_RC" -gt 1 ]; then
            echo "Bandit scanner execution failed with rc=$BANDIT_RC" >&2
            exit "$BANDIT_RC"
          fi
          python scripts/external/verify_bandit_baseline.py reports/external_acceptance/bandit-report.json
          semgrep --config auto --error backend scripts
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_DIGEST" detect --source=/repo --no-git --redact
          docker run --rm -v "$PWD:/repo" "$TRIVY_DIGEST" fs --exit-code 1 --severity HIGH,CRITICAL /repo
          docker run --rm -v "$PWD:/repo" "$SYFT_DIGEST" dir:/repo -o cyclonedx-json > reports/external_acceptance/sbom.cdx.json
          test -s reports/external_acceptance/sbom.cdx.json
          pip-licenses --format=json --with-urls --output-file=reports/external_acceptance/dependency_licenses.json
          python scripts/external/verify_supply_chain_artifacts.py

      - name: Capture real CI provenance
        env:
          CI: 'true'
          CI_RUN_ID: ${{ github.run_id }}
          CI_COMMIT_SHA: ${{ steps.identity.outputs.source_sha }}
        run: python scripts/external/provenance_capture.py

      - name: Generate canonical release metadata
        run: |
          python scripts/local_source_provenance.py
          python scripts/generate_release_manifest.py
          python scripts/generate_project_status.py
          python scripts/verify_release_consistency.py
          python scripts/production_readiness_dossier.py

      - name: Create fail-closed build evidence transfer manifest
        run: python scripts/ci_build_evidence_manifest.py create

      - name: Upload build evidence
        id: upload_build_evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-build-evidence-${{ steps.identity.outputs.source_sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            uv.lock
            frontend/package-lock.json
            frontend/dist/**
            reports/local_acceptance/**
            reports/external_acceptance/bandit-report.json
            reports/external_acceptance/sbom.cdx.json
            reports/external_acceptance/dependency_licenses.json
            reports/external_acceptance/supply_chain_artifact_verification.json
            reports/external_acceptance/scanner_image_digests.json
            reports/external_acceptance/provenance.json
            reports/CI_SCANNER_VERSIONS.txt
            reports/CI_TOOLCHAIN_RECEIPT.json
            reports/CI_CONTAINER_REPODIGEST.txt
            reports/ACCEPTANCE_REF_VALIDATION.json
            RELEASE_MANIFEST.json
            reports/PROJECT_STATUS.json
            reports/RELEASE_CONSISTENCY.json
            reports/PRODUCTION_READINESS_DOSSIER.json
            reports/CI_BUILD_EVIDENCE_MANIFEST.json

  real-target-acceptance:
    permissions:
      contents: read
      id-token: write
    needs: ci-build-evidence
    runs-on: [self-hosted, production-acceptance]
    environment: production-acceptance
    steps:
      - name: Checkout same candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.ci-build-evidence.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enforce Windows production acceptance runner
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') {
            throw "Production acceptance runner must be Windows; observed RUNNER_OS=$env:RUNNER_OS"
          }

      - name: Restore CI build evidence for the exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-build-evidence-${{ needs.ci-build-evidence.outputs.source_sha }}
          path: .

      - name: Verify transferred CI build evidence before use
        run: >-
          python scripts/ci_build_evidence_manifest.py verify
          --expected-git-sha "${{ needs.ci-build-evidence.outputs.source_sha }}"
          --expected-repository "${{ github.repository }}"
          --expected-run-id "${{ github.run_id }}"
          --expected-run-attempt "${{ github.run_attempt }}"
          --expected-workflow-ref "${{ github.workflow_ref }}"

      - name: Provision exact acceptance Python CLI toolchain from CI receipt
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $requirements = Join-Path $env:RUNNER_TEMP 'ci-toolchain-requirements.txt'
          $specs = & python scripts/ci_toolchain_receipt.py pip-specs
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve exact CI toolchain specs.' }
          $specs | Set-Content -LiteralPath $requirements -Encoding utf8
          python -m pip install --disable-pip-version-check -r $requirements
          if ($LASTEXITCODE -ne 0) { throw 'Could not provision exact acceptance CLI toolchain.' }
          python scripts/ci_toolchain_receipt.py verify --expected-git-sha "${{ needs.ci-build-evidence.outputs.source_sha }}" --verify-installed
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance CLI toolchain receipt verification failed.' }
          npm --version
          if ($LASTEXITCODE -ne 0) { throw 'npm is unavailable on production acceptance runner.' }
          docker --version
          if ($LASTEXITCODE -ne 0) { throw 'Docker is unavailable on production acceptance runner.' }

      - name: Bind GitHub artifact identity to transferred build evidence
        env:
          BUILD_ARTIFACT_ID: ${{ needs.ci-build-evidence.outputs.build_artifact_id }}
          BUILD_ARTIFACT_DIGEST: ${{ needs.ci-build-evidence.outputs.build_artifact_digest }}
          BUILD_ARTIFACT_NAME: ci-build-evidence-${{ needs.ci-build-evidence.outputs.source_sha }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:BUILD_ARTIFACT_ID)) { throw 'GitHub build artifact id is missing.' }
          if ([string]::IsNullOrWhiteSpace($env:BUILD_ARTIFACT_DIGEST)) { throw 'GitHub build artifact digest is missing.' }
          python scripts/ci_artifact_identity.py --artifact-id $env:BUILD_ARTIFACT_ID --artifact-digest $env:BUILD_ARTIFACT_DIGEST --artifact-name $env:BUILD_ARTIFACT_NAME --expected-git-sha "${{ needs.ci-build-evidence.outputs.source_sha }}"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub artifact identity binding failed.' }

      - name: Pull and verify exact immutable acceptance image
        env:
          ACCEPTANCE_CONTAINER_IMAGE: ${{ needs.ci-build-evidence.outputs.container_image }}
          EXPECTED_CONTAINER_DIGEST: ${{ needs.ci-build-evidence.outputs.container_digest }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_CONTAINER_DIGEST)) { throw 'Expected immutable container digest is missing.' }
          docker pull $env:EXPECTED_CONTAINER_DIGEST
          if ($LASTEXITCODE -ne 0) { throw 'Could not pull exact immutable acceptance image.' }
          $actual = (& docker inspect --format='{{index .RepoDigests 0}}' $env:EXPECTED_CONTAINER_DIGEST).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect exact immutable acceptance image.' }
          if ($actual -ne $env:EXPECTED_CONTAINER_DIGEST) {
            throw "Immutable container digest mismatch: expected=$env:EXPECTED_CONTAINER_DIGEST actual=$actual"
          }
          New-Item -ItemType Directory -Force -Path 'reports' | Out-Null
          $actual | Set-Content -LiteralPath 'reports/CI_CONTAINER_REPODIGEST_VERIFIED.txt' -Encoding utf8

      - name: Fail-closed production real-target preflight
        env:
          EXPECTED_ACCEPTANCE_SHA: ${{ needs.ci-build-evidence.outputs.source_sha }}
          EXPECTED_CONTAINER_DIGEST: ${{ needs.ci-build-evidence.outputs.container_digest }}
          ACCEPTANCE_CONTAINER_IMAGE: ${{ needs.ci-build-evidence.outputs.container_image }}
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
          BINANCE_TESTNET_EXECUTE: 'YES'
          PITR_DRILL_COMMAND: ${{ secrets.PITR_DRILL_COMMAND }}
          PITR_EVIDENCE_JSON: ${{ secrets.PITR_EVIDENCE_JSON }}
          HA_DRILL_COMMAND: ${{ secrets.HA_DRILL_COMMAND }}
          HA_EVIDENCE_JSON: ${{ secrets.HA_EVIDENCE_JSON }}
          WORM_ACCEPTANCE_COMMAND: ${{ secrets.WORM_ACCEPTANCE_COMMAND }}
          WORM_EVIDENCE_JSON: ${{ secrets.WORM_EVIDENCE_JSON }}
          RESTART_DRILL_COMMAND: ${{ secrets.RESTART_DRILL_COMMAND }}
          RESTART_EVIDENCE_JSON: ${{ secrets.RESTART_EVIDENCE_JSON }}
          PROVENANCE_SIGN_VERIFY_COMMAND: ${{ secrets.PROVENANCE_SIGN_VERIFY_COMMAND }}
          ACCEPTANCE_ENVIRONMENT_ID: ${{ vars.ACCEPTANCE_ENVIRONMENT_ID }}
          ACCEPTANCE_TOPOLOGY_HASH: ${{ vars.ACCEPTANCE_TOPOLOGY_HASH }}
          ACCEPTANCE_REQUIRE_CHALLENGE_TRUST: "1"
          ACCEPTANCE_CHALLENGE_VERIFY_COMMAND: ${{ secrets.ACCEPTANCE_CHALLENGE_VERIFY_COMMAND }}
          LEDGER_CHECKPOINT_SIGN_COMMAND: ${{ secrets.LEDGER_CHECKPOINT_SIGN_COMMAND }}
          ACCEPTANCE_LEDGER_CHECKPOINT_VERIFY_COMMAND: ${{ secrets.ACCEPTANCE_LEDGER_CHECKPOINT_VERIFY_COMMAND }}
          CI: 'true'
          CI_RUN_ID: ${{ github.run_id }}
          CI_COMMIT_SHA: ${{ needs.ci-build-evidence.outputs.source_sha }}
        run: >-
          python scripts/production_acceptance_preflight.py
          --output reports/production_acceptance/PRODUCTION_ACCEPTANCE_PREFLIGHT.json

      - name: Run fail-closed real-target orchestrator
        env:
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
          BINANCE_TESTNET_EXECUTE: 'YES'
          PITR_DRILL_COMMAND: ${{ secrets.PITR_DRILL_COMMAND }}
          PITR_EVIDENCE_JSON: ${{ secrets.PITR_EVIDENCE_JSON }}
          HA_DRILL_COMMAND: ${{ secrets.HA_DRILL_COMMAND }}
          HA_EVIDENCE_JSON: ${{ secrets.HA_EVIDENCE_JSON }}
          WORM_ACCEPTANCE_COMMAND: ${{ secrets.WORM_ACCEPTANCE_COMMAND }}
          WORM_EVIDENCE_JSON: ${{ secrets.WORM_EVIDENCE_JSON }}
          RESTART_DRILL_COMMAND: ${{ secrets.RESTART_DRILL_COMMAND }}
          RESTART_EVIDENCE_JSON: ${{ secrets.RESTART_EVIDENCE_JSON }}
          PROVENANCE_SIGN_VERIFY_COMMAND: ${{ secrets.PROVENANCE_SIGN_VERIFY_COMMAND }}
          ACCEPTANCE_CONTAINER_IMAGE: ${{ needs.ci-build-evidence.outputs.container_image }}
          ACCEPTANCE_ENVIRONMENT_ID: ${{ vars.ACCEPTANCE_ENVIRONMENT_ID }}
          ACCEPTANCE_TOPOLOGY_HASH: ${{ vars.ACCEPTANCE_TOPOLOGY_HASH }}
          ACCEPTANCE_REQUIRE_CHALLENGE_TRUST: "1"
          ACCEPTANCE_CHALLENGE_VERIFY_COMMAND: ${{ secrets.ACCEPTANCE_CHALLENGE_VERIFY_COMMAND }}
          LEDGER_CHECKPOINT_SIGN_COMMAND: ${{ secrets.LEDGER_CHECKPOINT_SIGN_COMMAND }}
          ACCEPTANCE_LEDGER_CHECKPOINT_VERIFY_COMMAND: ${{ secrets.ACCEPTANCE_LEDGER_CHECKPOINT_VERIFY_COMMAND }}
          CI: 'true'
          CI_RUN_ID: ${{ github.run_id }}
          CI_COMMIT_SHA: ${{ needs.ci-build-evidence.outputs.source_sha }}
        run: python scripts/production_acceptance_orchestrator.py --confirm-real-target

      - name: Final release gate must remain fail-closed unless every gate is satisfied
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          python scripts/generate_release_manifest.py
          if ($LASTEXITCODE -ne 0) { throw 'Release manifest generation failed.' }
          python scripts/generate_project_status.py
          if ($LASTEXITCODE -ne 0) { throw 'Project status generation failed.' }
          python scripts/verify_release_consistency.py
          if ($LASTEXITCODE -ne 0) { throw 'Release consistency verification failed.' }
          $gateOutput = & python scripts/release_gate.py 2>&1
          $gateRc = $LASTEXITCODE
          $gateOutput | Tee-Object -FilePath 'reports/CI_RELEASE_GATE.txt' | Out-Host
          if ($gateRc -ne 0) { throw 'Final release gate did not PASS.' }

      - name: Upload real-target evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-target-evidence-${{ needs.ci-build-evidence.outputs.source_sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            reports/external_acceptance/**
            reports/production_acceptance/**
            reports/PRODUCTION_ACCEPTANCE_ORCHESTRATION.json
            reports/CI_BUILD_ARTIFACT_IDENTITY.json
            reports/CI_RELEASE_GATE.txt
            RELEASE_MANIFEST.json
