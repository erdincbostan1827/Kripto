name: Phase 228 Production Runner Probe

on:
  push:
    branches:
      - phase228-production-runner-probe

permissions:
  contents: read

concurrency:
  group: phase228-production-runner-probe
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  production-runner-probe:
    runs-on: [self-hosted, production-acceptance]
    steps:
      - name: Checkout exact probe commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Capture Windows runner diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "RUNNER_IDENTITY=$($identity.Name)"
          Write-Host "RUNNER_IS_ADMIN=$isAdmin"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "RUNNER_TOOL_CACHE=$env:RUNNER_TOOL_CACHE"
          Write-Host "AGENT_TOOLSDIRECTORY=$env:AGENT_TOOLSDIRECTORY"

          $python = Get-Command python.exe -ErrorAction SilentlyContinue
          if ($python) {
            Write-Host "PYTHON_PATH=$($python.Source)"
            & $python.Source --version
          } else {
            Write-Host 'PYTHON_PATH=MISSING'
          }

          $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if ($sevenZip) {
            Write-Host "SEVENZIP_PATH=$($sevenZip.Source)"
          } else {
            Write-Host 'SEVENZIP_PATH=MISSING'
          }

          $services = @(Get-CimInstance Win32_Service -ErrorAction SilentlyContinue | Where-Object {
            $_.PathName -like '*actions-runner-kripto-prod*'
          })
          if ($services.Count -eq 0) {
            Write-Host 'RUNNER_SERVICE=NOT_DETECTED_FOR_DIRECTORY'
          } else {
            foreach ($service in $services) {
              Write-Host "RUNNER_SERVICE=$($service.Name);STATE=$($service.State);ACCOUNT=$($service.StartName)"
            }
          }

          if (-not $python) {
            throw 'DIAGNOSTIC_EXPECTED_BLOCKER: Python 3.12 is not available on the runner PATH.'
          }

      - name: Prepare compose environment without production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -f .env.example
          cp .env.example .env

      - name: Run secret-free production runner readiness
        run: >-
          python scripts/production_runner_readiness.py
          --require-actions-context
          --output reports/production_acceptance/PRODUCTION_RUNNER_READINESS.json

      - name: Upload runner readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase228-production-runner-readiness-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: reports/production_acceptance/PRODUCTION_RUNNER_READINESS.json
