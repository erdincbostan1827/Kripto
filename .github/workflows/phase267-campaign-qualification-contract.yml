name: Phase267 Campaign Qualification Contract

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/phase262-final-main-phase245-dispatch.yml'
      - '.github/workflows/phase267-protected-campaign-qualification.yml'
      - '.github/workflows/phase267-private-stream-qualification.yml'
      - '.github/workflows/phase267-campaign-qualification-contract.yml'
      - 'backend/app/release/campaign_runtime_adapter.py'
      - 'scripts/external/phase267_campaign_qualification.py'
      - 'scripts/external/phase267_private_stream_qualification.py'
      - 'tests/test_phase266_campaign_runtime.py'

permissions:
  contents: read

jobs:
  qualification-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Install locked test runtime
        run: |
          python -m pip install 'uv==0.12.9'
          uv sync --locked --extra test
      - name: Compile Phase267 qualification surfaces
        run: |
          .venv/bin/python -m py_compile \
            backend/app/release/campaign_runtime_adapter.py \
            scripts/external/phase267_campaign_qualification.py \
            scripts/external/phase267_private_stream_qualification.py \
            tests/test_phase266_campaign_runtime.py
      - name: Run protected campaign runtime tests
        run: .venv/bin/python -m pytest -q tests/test_phase266_campaign_runtime.py
      - name: Enforce no exchange order surface in shadow qualification
        shell: bash
        run: |
          set -euo pipefail
          for forbidden in '.submit_order(' '.cancel_order(' 'order.place' 'order.cancel' '/api/v3/order'; do
            if grep -F "$forbidden" scripts/external/phase267_campaign_qualification.py; then
              echo "Forbidden exchange order surface in shadow qualification: $forbidden" >&2
              exit 1
            fi
          done
      - name: Enforce exact-main Phase262 binding and deterministic Phase266 seed
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/phase262-final-main-phase245-dispatch.yml'
          grep -F 'branch=main' "$workflow"
          grep -F '.head_branch == "main"' "$workflow"
          grep -F '.event == "push"' "$workflow"
          grep -F '.head_sha == $sha' "$workflow"
          grep -F 'Phase265 Campaign Collector Contract' "$workflow"
          grep -F 'Phase266 Campaign Runtime Contract' "$workflow"
          grep -F 'Phase267 Campaign Qualification Contract' "$workflow"
          grep -F 'PHASE262_PREVIOUS_PHASE245_RUN_NUMBER' "$workflow"
          grep -F '.run_number > $previous' "$workflow"
          grep -F 'PHASE262_PHASE245_EXACT_SHA=PASS' "$workflow"
          grep -F 'PHASE262_PHASE245_RUN_ID=$run_id' "$workflow"
          grep -F 'Refusing Phase266 seed without exact-SHA Phase245 PASS evidence.' "$workflow"
          grep -F 'Refusing Phase266 seed for superseded SHA' "$workflow"
          grep -F 'gh workflow run phase266-protected-campaign-sampling.yml' "$workflow"
          grep -F -- '-f candidate_ref="$CANDIDATE_REF"' "$workflow"
          grep -F -- '-f max_cycles=4' "$workflow"
          grep -F 'PHASE274_PHASE266_SEED_DISPATCH=ACCEPTED' "$workflow"
          grep -F 'Phase245 success and Phase266 sampling are non-LIVE evidence only and never authorize LIVE trading.' "$workflow"
      - name: Enforce non-vacuous live-shadow qualification contract
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/phase267-protected-campaign-qualification.yml'
          runner='scripts/external/phase267_campaign_qualification.py'
          grep -F 'Phase 266 Protected Campaign Sampling' "$workflow"
          grep -F "github.event.workflow_run.conclusion == 'success'" "$workflow"
          grep -F 'WORKFLOW_RUN_SHA' "$workflow"
          grep -F 'runs-on: [self-hosted, production-acceptance]' "$workflow"
          grep -F 'ref: main' "$workflow"
          grep -F 'actions: read' "$workflow"
          grep -F 'No successful exact-SHA Phase266 protected campaign sampling exists' "$workflow"
          grep -F ".github/workflows/phase266-protected-campaign-sampling.yml" "$workflow"
          grep -F 'refuses to create replacement state' "$workflow"
          grep -F 'refuses to create a new telemetry key' "$workflow"
          grep -F -- '--minimum-pairs 100' "$workflow"
          grep -F 'requires at least 100 paired real observations' "$runner"
          grep -F 'live_enabled": False' "$runner"
          grep -F 'production_ready": False' "$runner"
      - name: Enforce bounded TESTNET-only private qualification contract
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/phase267-private-stream-qualification.yml'
          runner='scripts/external/phase267_private_stream_qualification.py'
          grep -F 'Phase 266 Protected Campaign Sampling' "$workflow"
          grep -F "github.event.workflow_run.conclusion == 'success'" "$workflow"
          grep -F 'WORKFLOW_RUN_SHA' "$workflow"
          grep -F 'runs-on: [self-hosted, production-acceptance]' "$workflow"
          grep -F 'ref: main' "$workflow"
          grep -F 'actions: read' "$workflow"
          grep -F 'No successful exact-SHA Phase266 protected campaign sampling exists' "$workflow"
          grep -F ".github/workflows/phase266-protected-campaign-sampling.yml" "$workflow"
          grep -F -- '--max-notional 5' "$workflow"
          grep -F 'max_notional > Decimal("15")' "$runner"
          grep -F 'from scripts.external.phase266_campaign_runtime import TESTNET_REST, TESTNET_WS_API' "$runner"
          grep -F 'newClientOrderId' "$runner"
          grep -F 'quoteOrderQty' "$runner"
          grep -F 'DUPLICATE_FILL' "$runner"
          grep -F 'OUT_OF_ORDER_ORDER_EVENT' "$runner"
          grep -F 'record_private_rest_reconciliation' "$runner"
          grep -F 'secrets_recorded": False' "$runner"
          grep -F 'live_enabled": False' "$runner"
          grep -F 'production_ready": False' "$runner"
          if grep -F 'https://api.binance.com' "$runner"; then
            echo 'Production Binance endpoint is forbidden in the private TESTNET qualification runner.' >&2
            exit 1
          fi
