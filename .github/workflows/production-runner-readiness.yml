name: Production Runner Readiness

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Immutable git tag or exact SHA to inspect on the self-hosted production runner
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-runner-readiness-${{ github.event.inputs.candidate_ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12.10'

jobs:
  production-runner-readiness:
    runs-on: [self-hosted, production-acceptance]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.inputs.candidate_ref }}
          fetch-depth: 0

      - name: Setup pinned Python from runner tool cache
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify pinned Python identity
        shell: powershell
        run: |
          $version = (& python -c "import sys; print('.'.join(map(str, sys.version_info[:3])))").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne '${{ env.PYTHON_VERSION }}') {
            throw "Expected Python ${{ env.PYTHON_VERSION }}, got '$version'."
          }
          $pythonPath = (Get-Command python.exe).Source
          if (-not $pythonPath.StartsWith($env:RUNNER_TOOL_CACHE, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Python was not resolved from RUNNER_TOOL_CACHE: $pythonPath"
          }
          python -m pip --version
          if ($LASTEXITCODE -ne 0) {
            throw 'Pinned runner tool-cache Python does not provide pip.'
          }
          Write-Host "Pinned runner Python PASS: $pythonPath"

      - name: Enforce immutable candidate ref
        run: python scripts/validate_acceptance_ref.py "${{ github.event.inputs.candidate_ref }}"

      - name: Capture exact candidate identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          test -n "$SHA"
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Prepare compose environment without production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -f .env.example
          cp .env.example .env

      - name: Secret-free production runner readiness
        run: >-
          python scripts/production_runner_readiness.py
          --require-actions-context
          --output reports/production_acceptance/PRODUCTION_RUNNER_READINESS.json

      - name: Upload runner readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-runner-readiness-${{ steps.identity.outputs.source_sha }}
          if-no-files-found: warn
          retention-days: 30
          path: reports/production_acceptance/PRODUCTION_RUNNER_READINESS.json
