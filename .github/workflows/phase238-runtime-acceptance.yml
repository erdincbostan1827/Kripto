name: Phase 238 Runtime Acceptance
run-name: Phase 238 Runtime Acceptance ${{ inputs.candidate_ref }}

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact 40-character commit SHA to validate on the production-acceptance runner
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase238-runtime-acceptance-${{ inputs.candidate_ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12.10'

jobs:
  runtime-acceptance:
    name: runtime-acceptance
    runs-on: [self-hosted, production-acceptance]
    environment: production-acceptance
    timeout-minutes: 45
    env:
      ACCEPTANCE_REQUIRE_CHALLENGE_TRUST: '1'
      ACCEPTANCE_CHALLENGE_VERIFY_COMMAND: ${{ secrets.ACCEPTANCE_CHALLENGE_VERIFY_COMMAND }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
          clean: true

      - name: Setup pinned Python from runner tool cache
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: false

      - name: Enforce immutable candidate and source locks
        shell: pwsh
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_REF -notmatch '^[0-9a-fA-F]{40}$') {
            throw "candidate_ref must be an exact 40-character commit SHA"
          }
          python scripts/validate_acceptance_ref.py $env:CANDIDATE_REF
          if ($LASTEXITCODE -ne 0) { throw 'Immutable candidate validation failed.' }
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:CANDIDATE_REF.ToLowerInvariant()) {
            throw "Checked out SHA mismatch: $head"
          }
          python scripts/verify_source_locks.py
          if ($LASTEXITCODE -ne 0) { throw 'Source-lock verification failed.' }

      - name: Prepare isolated secret-free runtime environment identity
        shell: pwsh
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $reports = Join-Path $PWD 'reports/external_acceptance'
          New-Item -ItemType Directory -Force -Path $reports | Out-Null
          $runtimeEnv = Join-Path $reports 'runtime.env'
          Copy-Item -LiteralPath '.env.example' -Destination $runtimeEnv -Force

          if (Test-Path -LiteralPath 'secrets') {
            throw 'Pre-existing secrets directory detected after clean checkout; refusing to reuse it for Phase 238.'
          }
          python scripts/bootstrap_secrets.py
          if ($LASTEXITCODE -ne 0) { throw 'Ephemeral acceptance secret bootstrap failed.' }

          $shortSha = $env:CANDIDATE_REF.Substring(0, 12).ToLowerInvariant()
          $projectName = "kripto_phase238_$shortSha"
          $acceptanceEnvironmentId = "github-actions:$env:RUNNER_NAME:$env:RUNNER_OS:$env:RUNNER_ARCH:$projectName"

          $env:COMPOSE_PROJECT_NAME = $projectName
          $env:APP_ENV_FILE = 'reports/external_acceptance/runtime.env'
          $env:ACCEPTANCE_ENVIRONMENT_ID = $acceptanceEnvironmentId
          "COMPOSE_PROJECT_NAME=$projectName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_ENV_FILE=reports/external_acceptance/runtime.env" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ACCEPTANCE_ENVIRONMENT_ID=$acceptanceEnvironmentId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $composeConfig = & docker compose config 2>&1
          if ($LASTEXITCODE -ne 0) {
            $composeConfig | Out-Host
            throw 'docker compose config failed for isolated Phase 238 environment.'
          }
          $composeConfigPath = Join-Path $reports 'phase238_compose_config.txt'
          $composeConfig | Set-Content -LiteralPath $composeConfigPath -Encoding utf8
          $topologyHash = (Get-FileHash -LiteralPath $composeConfigPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:ACCEPTANCE_TOPOLOGY_HASH = $topologyHash
          "ACCEPTANCE_TOPOLOGY_HASH=$topologyHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $identityDir = Join-Path $PWD 'reports/phase238'
          New-Item -ItemType Directory -Force -Path $identityDir | Out-Null
          $identity = [ordered]@{
            schema_version = '1.0'
            classification = 'PHASE238_RUNTIME_TARGET_IDENTITY_NOT_ACCEPTANCE_EVIDENCE'
            candidate_sha = $env:CANDIDATE_REF.ToLowerInvariant()
            runner_name = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            compose_project_name = $projectName
            acceptance_environment_id = $acceptanceEnvironmentId
            topology_hash = $topologyHash
            truth_policy = 'This identity receipt binds the runtime attempt to the actual self-hosted runner and compose topology; acceptance still requires the trusted release challenge and runtime manifest PASS.'
          }
          $identity | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $identityDir 'RUNTIME_TARGET_IDENTITY.json') -Encoding utf8

      - name: Generate fresh release-bound challenge
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          python scripts/generate_acceptance_challenge.py
          if ($LASTEXITCODE -ne 0) { throw 'Release challenge generation failed.' }

      - name: Run fail-closed real runtime acceptance profile
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          python scripts/external_acceptance_runner.py --profile runtime --confirm-real-target --timeout 900
          if ($LASTEXITCODE -ne 0) { throw 'Phase 238 real runtime acceptance did not PASS.' }

      - name: Capture Phase 238 result
        if: always()
        shell: pwsh
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $PWD 'reports/phase238'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $manifestPath = Join-Path $PWD 'reports/external_acceptance/manifest_runtime.json'
          $passed = $false
          $blocker = 'RUNTIME_MANIFEST_MISSING'
          $challengeVerified = $false
          $challengeTrustVerified = $false
          $runtimeGroup = 'NOT_EVALUATED'
          if (Test-Path -LiteralPath $manifestPath -PathType Leaf) {
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $challengeVerified = ($manifest.challenge.verified -eq $true)
            $challengeTrustVerified = ($manifest.challenge.trust_verified -eq $true)
            if ($null -ne $manifest.groups -and $null -ne $manifest.groups.runtime) {
              $runtimeGroup = [string]$manifest.groups.runtime
            }
            if ($null -ne $manifest.PSObject.Properties['blocker']) {
              $blocker = [string]$manifest.blocker
            } elseif ($manifest.selected_all_pass -eq $true) {
              $blocker = ''
            } else {
              $blocker = 'RUNTIME_PROFILE_NOT_ALL_PASS'
            }
            $passed = (
              $manifest.classification -eq 'EXTERNAL_ACCEPTANCE_EVIDENCE_BUNDLE' -and
              $manifest.profile -eq 'runtime' -and
              $manifest.real_target_explicitly_confirmed -eq $true -and
              $challengeVerified -and
              $challengeTrustVerified -and
              $manifest.selected_all_pass -eq $true -and
              $runtimeGroup -eq 'PASS' -and
              $manifest.environment.git_commit_sha -eq $env:CANDIDATE_REF.ToLowerInvariant()
            )
          }
          $result = [ordered]@{
            schema_version = '1.0'
            classification = 'PHASE238_RUNTIME_ACCEPTANCE_WORKFLOW_RESULT'
            candidate_sha = $env:CANDIDATE_REF.ToLowerInvariant()
            runner_name = $env:RUNNER_NAME
            passed = $passed
            blocker = $blocker
            challenge_verified = $challengeVerified
            challenge_trust_verified = $challengeTrustVerified
            runtime_group = $runtimeGroup
            production_ready = $false
            truth_policy = 'Phase 238 PASS closes only the Docker/PostgreSQL/Redis runtime profile for this exact candidate and target identity. It does not authorize LIVE trading.'
          }
          $result | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $outDir 'PHASE238_RUNTIME_RESULT.json') -Encoding utf8
          $result | ConvertTo-Json -Depth 8 | Out-Host

      - name: Tear down isolated runtime resources and erase ephemeral secrets
        if: always()
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not [string]::IsNullOrWhiteSpace($env:COMPOSE_PROJECT_NAME)) {
            docker compose down -v --remove-orphans
            if ($LASTEXITCODE -ne 0) { throw 'Phase 238 isolated compose cleanup failed.' }
          }
          if (Test-Path -LiteralPath 'secrets') {
            Remove-Item -LiteralPath 'secrets' -Recurse -Force
          }

      - name: Upload exact-SHA Phase 238 runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase238-runtime-acceptance-${{ inputs.candidate_ref }}
          if-no-files-found: error
          retention-days: 30
          path: |
            reports/external_acceptance/release_challenge.json
            reports/external_acceptance/manifest_runtime.json
            reports/external_acceptance/runs/**
            reports/external_acceptance/phase238_compose_config.txt
            reports/phase238/**
