name: crypto-trading-platform-v51
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U trading -d trading"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    command: ["redis-server","--appendonly","yes","--save","60","1"]
    volumes: [redis_data:/data]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  test:
    build: {context: ., dockerfile: backend/Dockerfile, target: test}
    environment: {ENVIRONMENT: TEST, MODE: PAPER}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    profiles: [test]

  app:
    build: {context: ., dockerfile: backend/Dockerfile, target: runtime}
    env_file: [${APP_ENV_FILE:-.env}]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      APP_ENCRYPTION_KEY_FILE: /run/secrets/app_encryption_key
      ADMIN_BOOTSTRAP_TOKEN_FILE: /run/secrets/admin_bootstrap_token
      AUDIT_HMAC_KEY_FILE: /run/secrets/audit_hmac_key
      HEARTBEAT_HMAC_KEY_FILE: /run/secrets/heartbeat_hmac_key
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
    secrets: [postgres_password, app_encryption_key, admin_bootstrap_token, audit_hmac_key, heartbeat_hmac_key, backup_encryption_key]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}
        reservations: {cpus: "0.25", memory: 256M}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=3).read()"], interval: 15s, timeout: 5s, retries: 5}

  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.30.4-alpine@sha256:93722936b82ec8a1178d48448e619226680d2de3706a1640800e186cd5fa7fd3
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [app, frontend]
    ports: ["8080:8080"]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
        reservations: {cpus: "0.10", memory: 64M}

  prometheus:
    image: prom/prometheus:v3.14.0-distroless@sha256:50c707e96da5ade383cb1707790576480485e93de06aa60ad8802cb5f744bd0a
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.retention.time=30d"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana_admin_password]
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  watchdog:
    build: {context: ., dockerfile: backend/Dockerfile, target: runtime}
    env_file: [${APP_ENV_FILE:-.env}]
    environment:
      HEARTBEAT_HMAC_KEY_FILE: /run/secrets/heartbeat_hmac_key
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
    secrets: [heartbeat_hmac_key]
    command: ["python","/app/scripts/watchdog_runner.py"]
    depends_on: [app]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

secrets:
  postgres_password: {file: ./secrets/postgres_password.txt}
  grafana_admin_password: {file: ./secrets/grafana_admin_password.txt}
  app_encryption_key: {file: ./secrets/app_encryption_key.txt}
  admin_bootstrap_token: {file: ./secrets/admin_bootstrap_token.txt}
  audit_hmac_key: {file: ./secrets/audit_hmac_key.txt}
  heartbeat_hmac_key: {file: ./secrets/heartbeat_hmac_key.txt}
  backup_encryption_key: {file: ./secrets/backup_encryption_key.txt}
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
