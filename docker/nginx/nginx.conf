worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream backend { server app:8000; }
  upstream ui { server frontend:8080; }
  server {
    listen 8080;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'" always;
    location /api/ {
      limit_req zone=api_rate burst=40 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://backend;
    }
    location ~ ^/(health|ready|metrics)$ {
      proxy_set_header Host $host;
      proxy_pass http://backend;
    }
    location /api/v1/ws {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_pass http://backend;
    }
    location / { proxy_pass http://ui; }
  }
}
