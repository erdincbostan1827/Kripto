[project]
name="crypto-trading-platform-v51"
version="0.3.0"
requires-python=">=3.12"
dependencies=["fastapi==0.128.2","pydantic==2.13.4","sqlalchemy==2.0.50","psycopg[binary]==3.3.4","httpx==0.28.1","pandas==2.2.3","numpy==2.3.5","scipy==1.17.0","argon2-cffi==25.1.0","cryptography==46.0.4","prometheus-client==0.25.0","psutil==7.2.2","uvicorn[standard]==0.48.0","websockets==16.0","alembic==1.18.4"]
[project.optional-dependencies]
test=["pytest==9.0.2","pytest-asyncio==1.4.0","pytest-cov==7.0.0"]
[tool.pytest.ini_options]
pythonpath=["backend","."]
testpaths=["tests"]
addopts="-q -W error"
[tool.ruff]
line-length=120
[tool.mypy]
python_version="3.12"
warn_return_any=true
warn_unused_configs=true

[build-system]
requires=["setuptools==82.0.1"]
build-backend="setuptools.build_meta"

[tool.setuptools]
package-dir={""="backend"}

[tool.setuptools.packages.find]
where=["backend"]
